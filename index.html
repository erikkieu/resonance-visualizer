<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <title>Resonance</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23bff6ff'/%3E%3Cstop offset='.55' stop-color='%232fb7d6'/%3E%3Cstop offset='1' stop-color='%23122a6b'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='url(%23g)'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Everything below is UI chrome; H toggles it, inactivity auto-hides it. -->
    <div id="ui" class="ui">
      <header class="top-left">
        <div class="brand">Resonance</div>
        <div class="scene-label" id="scene-label">
          <span class="scene-num" id="scene-num">01</span>
          <span class="scene-name" id="scene-name">Liquid Paint</span>
          <span class="scene-sub" id="scene-sub">acrylic fluid pour</span>
        </div>
      </header>

      <div class="bottom">
        <div class="audio-panel glass" id="audio-panel">
          <div class="source-buttons">
            <button class="btn" id="btn-mic" title="Use microphone">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0M12 17v4m-3 0h6" /></svg>
              <span>Mic</span>
            </button>
            <button class="btn" id="btn-file" title="Open an audio file">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm11-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
              <span>File</span>
            </button>
            <button class="btn" id="btn-demo" title="Synthetic demo signal">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h3l2-6 4 12 3-9 2 3h4" /></svg>
              <span>Demo</span>
            </button>
          </div>
          <div class="transport" id="transport" hidden>
            <button class="btn icon" id="btn-play" title="Play / pause (space)">
              <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7Z" /></svg>
              <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" /></svg>
            </button>
            <div class="track">
              <div class="track-name" id="track-name">—</div>
              <div class="seek-row">
                <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek" />
                <span class="time" id="time">0:00</span>
              </div>
            </div>
          </div>
          <div class="source-status" id="source-status">Idle signal</div>
        </div>

        <div class="center-col">
          <div class="hint gone" id="hint">1-5 scenes · F fullscreen · H hide UI</div>
          <nav class="scene-buttons glass" id="scene-buttons" aria-label="Scenes"></nav>
        </div>

        <div class="right-panel">
          <div class="meter glass" id="meter" title="Bass · Mid · Treble · Energy">
            <span class="bar" data-k="bass"><i></i></span>
            <span class="bar" data-k="mid"><i></i></span>
            <span class="bar" data-k="treble"><i></i></span>
            <span class="bar" data-k="energy"><i></i></span>
            <span class="beat-dot" id="beat-dot"></span>
          </div>
          <button class="btn icon glass" id="btn-fullscreen" title="Fullscreen (F)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
          </button>
        </div>
      </div>
    </div>

    <div id="start" class="start">
      <div class="start-card">
        <h1>Resonance</h1>
        <p class="start-sub">Click to begin · choose microphone or drop an audio file</p>
        <div class="start-buttons">
          <button class="btn big" id="start-mic">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0M12 17v4m-3 0h6" /></svg>
            Microphone
          </button>
          <button class="btn big" id="start-file">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm11-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
            Audio file
          </button>
          <button class="btn big" id="start-demo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h3l2-6 4 12 3-9 2 3h4" /></svg>
            Demo mode
          </button>
        </div>
        <p class="start-foot">1-5 scenes · F fullscreen · H hide UI</p>
      </div>
    </div>

    <div id="drop" class="drop" hidden><div class="drop-inner">Drop audio to play</div></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="fallback" class="fallback" hidden></div>
    <input type="file" id="file-input" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac" hidden />

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
